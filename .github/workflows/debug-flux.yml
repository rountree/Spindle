name: debug-flux

on:
  workflow_dispatch:

permissions:
  contents: read
  packages: read

concurrency:
  group: debug-flux-${{github.ref}}-${{github.event.pull_request.number || github.run_number}}
  cancel-in-progress: true

jobs:
  spindle-debug-flux:
    name: Debug Testsuite (Flux, Ubuntu)
    environment: Spindle CI
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      NUM_NODES: 8
      TASKS_PER_NODE: 3
    steps:
      - name: Check out Spindle
        uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd

      - name: Setup Docker Compose
        uses: docker/setup-compose-action@8cccb8c14b6500aaffebff1aa49c502c34d2e5e6
        with:
          version: latest

      - name: Generate docker-compose.yml
        id: debug-flux-generate
        run: |
          cd containers/debug/spindle-flux-ubuntu
          ./generate-compose.py ${{ env.NUM_NODES }} > docker-compose.yml

      - name: Build spindle-debug-flux image
        id: debug-flux-build
        run: |
          cd containers/debug/spindle-flux-ubuntu
          docker compose --progress=plain build

      - name: Bring spindle-debug-flux up
        id: debug-flux-up
        run: |
          cd containers/debug/spindle-flux-ubuntu
          docker compose up -d --wait --wait-timeout 60

      - name: Dump container logs on startup failure
        if: failure() && steps.debug-flux-up.outcome == 'failure'
        run: |
          cd containers/debug/spindle-flux-ubuntu
          echo "=== Container status ==="
          docker compose ps -a
          echo "=== Node-1 broker.toml ==="
          docker run --rm spindle-flux-ubuntu:latest cat /etc/flux/config/broker.toml || true
          echo "=== Dumping logs for all ${{ env.NUM_NODES }} nodes ==="
          for i in $(seq 1 ${{ env.NUM_NODES }}); do
            echo "=== Node-${i} logs ==="
            docker logs node-${i} || true
          done

      - name: Verify munge works in spindle-debug-flux
        id: debug-flux-munge
        run: |
          docker exec node-1 bash -c 'munge -n | unmunge'

      # Common options
      #   docker exec node-1 bash -c 'cd Spindle-build/testsuite/debug && \
      #   ./runTests.py \
      #   --run-all-tests \
      #   --resource-manager=flux \
      #   --num-nodes=${{ env.NUM_NODES }} \
      #   --tasks-per-node=${{ env.TASKS_PER_NODE }} \
      #   --cores-per-task=1 \
      #   --time-limit=1m \
      #   --spindle-debug=3 \
      #   --preserve-logs-on-success \
      #   --verbose'
      #   Single-test example
      #   --single-test=dependency_preload \
      - name: Run spindle-debug-flux testsuite
        id: debug-flux-testsuite
        run: |
          docker exec node-1 bash -c 'cd Spindle-build/testsuite/debug && \
          ./runTests.py \
          --resource-manager=flux \
          --flux-interface=API \
          --num-nodes=${{ env.NUM_NODES }} \
          --tasks-per-node=${{ env.TASKS_PER_NODE }} \
          --time-limit=1m \
          --spindle-debug=3 \
          --preserve-logs-on-success \
          --single-test=dependency_push \
          --version \
          --verbose'

      - name: Copy debug logs from shared filesystem
        id: debug-flux-copy-logs
        if: ${{ always() }}
        continue-on-error: true
        run: |
          mkdir -p debug-logs
          # With --no-shared-filesystem, logs are in the shared volume
          docker cp node-1:/shared-logs/. debug-logs/ || true

      - name: Set short SHA
        id: short-sha
        if: ${{ always() }}
        run: echo "sha_short=$(echo ${{ github.sha }} | cut -c1-7)" >> $GITHUB_OUTPUT

      - name: Upload debug artifacts
        id: debug-flux-upload
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: debug-flux-logs-${{ github.run_number }}-${{ steps.short-sha.outputs.sha_short }}
          path: debug-logs/
          if-no-files-found: ignore
          retention-days: 7

      - name: Bring spindle-debug-flux down
        id: debug-flux-down
        if: ${{ always() }}
        continue-on-error: true
        run: |
          cd containers/debug/spindle-flux-ubuntu
          docker compose down
